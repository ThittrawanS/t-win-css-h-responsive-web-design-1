<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse by Job Categories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#1B2B65',
                        orange: {
                            brand: '#FF6B2C',
                            soft: '#FFF0E8',
                            icon: '#FF7A3D',
                        },
                        muted: '#9CA3AF',
                    },
                    boxShadow: {
                        card: '0 4px 24px rgba(27, 43, 101, 0.06)',
                        icon: '0 8px 20px rgba(255, 107, 44, 0.35)',
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-[#FAFBFC] min-h-screen font-sans antialiased">
    <section class="max-w-[1920px] mx-auto px-4 py-12 sm:px-6 sm:py-16 lg:px-16 xl:px-24 lg:py-20">
        <!-- Heading -->
        <h1 class="text-center text-2xl sm:text-3xl lg:text-4xl font-bold text-navy mb-8 sm:mb-12">
            Browse by
            <span class="relative inline-block">
                Job
                <span class="absolute left-0 right-0 -bottom-1 h-[5px] bg-orange-brand rounded-full"></span>
            </span>
            Categories
        </h1>

        <!-- Categories Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 sm:gap-5">

            <!-- Digital Marketing -->
            <a href="#" class="group bg-white rounded-2xl border border-gray-100 shadow-card p-5 sm:p-6 flex flex-col min-h-[160px] hover:shadow-md transition-shadow">
                <div class="w-12 h-12 rounded-full bg-orange-soft flex items-center justify-center mb-5">
                    <svg class="w-6 h-6 text-orange-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z" />
                    </svg>
                </div>
                <h2 class="text-navy font-bold text-base sm:text-lg">Digital Marketing</h2>
                <p class="text-muted text-sm mt-1">143 Jobs Opened</p>
                <span class="mt-auto self-end text-navy text-xl leading-none group-hover:translate-x-1 transition-transform">→</span>
            </a>

            <!-- Art & Design -->
            <a href="#" class="group bg-white rounded-2xl border border-gray-100 shadow-card p-5 sm:p-6 flex flex-col min-h-[160px] hover:shadow-md transition-shadow">
                <div class="w-12 h-12 rounded-full bg-orange-soft flex items-center justify-center mb-5">
                    <svg class="w-6 h-6 text-orange-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                    </svg>
                </div>
                <h2 class="text-navy font-bold text-base sm:text-lg">Art &amp; Design</h2>
                <p class="text-muted text-sm mt-1">110 Jobs Opened</p>
                <span class="mt-auto self-end text-navy text-xl leading-none group-hover:translate-x-1 transition-transform">→</span>
            </a>

            <!-- Accounting (active / highlighted icon) -->
            <a href="#" class="group bg-white rounded-2xl border border-gray-100 shadow-card p-5 sm:p-6 flex flex-col min-h-[160px] hover:shadow-md transition-shadow">
                <div class="w-12 h-12 rounded-full bg-orange-brand shadow-icon flex items-center justify-center mb-5">
                    <span class="text-white font-bold text-xl">$</span>
                </div>
                <h2 class="text-navy font-bold text-base sm:text-lg">Accounting</h2>
                <p class="text-muted text-sm mt-1">158 Jobs Opened</p>
                <span class="mt-auto self-end text-navy text-xl leading-none group-hover:translate-x-1 transition-transform">→</span>
            </a>

            <!-- Photography -->
            <a href="#" class="group bg-white rounded-2xl border border-gray-100 shadow-card p-5 sm:p-6 flex flex-col min-h-[160px] hover:shadow-md transition-shadow">
                <div class="w-12 h-12 rounded-full bg-orange-soft flex items-center justify-center mb-5">
                    <svg class="w-6 h-6 text-orange-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </div>
                <h2 class="text-navy font-bold text-base sm:text-lg">Photography</h2>
                <p class="text-muted text-sm mt-1">95 Jobs Opened</p>
                <span class="mt-auto self-end text-navy text-xl leading-none group-hover:translate-x-1 transition-transform">→</span>
            </a>

            <!-- Copy Writing -->
            <a href="#" class="group bg-white rounded-2xl border border-gray-100 shadow-card p-5 sm:p-6 flex flex-col min-h-[160px] hover:shadow-md transition-shadow">
                <div class="w-12 h-12 rounded-full bg-orange-soft flex items-center justify-center mb-5">
                    <svg class="w-6 h-6 text-orange-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                    </svg>
                </div>
                <h2 class="text-navy font-bold text-base sm:text-lg">Copy Writing</h2>
                <p class="text-muted text-sm mt-1">113 Jobs Opened</p>
                <span class="mt-auto self-end text-navy text-xl leading-none group-hover:translate-x-1 transition-transform">→</span>
            </a>

            <!-- Music -->
            <a href="#" class="group bg-white rounded-2xl border border-gray-100 shadow-card p-5 sm:p-6 flex flex-col min-h-[160px] hover:shadow-md transition-shadow">
                <div class="w-12 h-12 rounded-full bg-orange-soft flex items-center justify-center mb-5">
                    <svg class="w-6 h-6 text-orange-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                    </svg>
                </div>
                <h2 class="text-navy font-bold text-base sm:text-lg">Music</h2>
                <p class="text-muted text-sm mt-1">55 Jobs Opened</p>
                <span class="mt-auto self-end text-navy text-xl leading-none group-hover:translate-x-1 transition-transform">→</span>
            </a>

            <!-- Human Resources -->
            <a href="#" class="group bg-white rounded-2xl border border-gray-100 shadow-card p-5 sm:p-6 flex flex-col min-h-[160px] hover:shadow-md transition-shadow">
                <div class="w-12 h-12 rounded-full bg-orange-soft flex items-center justify-center mb-5">
                    <svg class="w-6 h-6 text-orange-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                </div>
                <h2 class="text-navy font-bold text-base sm:text-lg">Human Resources</h2>
                <p class="text-muted text-sm mt-1">25 Jobs Opened</p>
                <span class="mt-auto self-end text-navy text-xl leading-none group-hover:translate-x-1 transition-transform">→</span>
            </a>

            <!-- Explore CTA -->
            <a href="#" class="group relative overflow-hidden rounded-2xl bg-orange-brand p-5 sm:p-6 flex items-center justify-center min-h-[160px] hover:brightness-105 transition">
                <!-- Decorative wavy lines -->
                <svg class="absolute inset-0 w-full h-full opacity-30 pointer-events-none" viewBox="0 0 200 160" preserveAspectRatio="none" aria-hidden="true">
                    <path d="M0 40 Q50 20 100 40 T200 40" fill="none" stroke="#E85A1A" stroke-width="2"/>
                    <path d="M0 70 Q50 50 100 70 T200 70" fill="none" stroke="#E85A1A" stroke-width="2"/>
                    <path d="M0 100 Q50 80 100 100 T200 100" fill="none" stroke="#E85A1A" stroke-width="2"/>
                    <path d="M0 130 Q50 110 100 130 T200 130" fill="none" stroke="#E85A1A" stroke-width="2"/>
                </svg>
                <span class="relative z-10 text-white font-semibold text-base sm:text-lg text-center leading-snug">
                    Explore 30 More<br>Categories
                    <span class="inline-block ml-1 group-hover:translate-x-1 transition-transform">→</span>
                </span>
            </a>

        </div>
    </section>
</body>
</html>
