<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse by Job Categories</title>

    <!-- ฟอนต์ -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:wght@400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBlue: "#25324B",
                        orange: "#FF8345",
                        softOrange: "#FFF0E8",
                        greyText: "#7C8493",
                        cardBorder: "#EDEDED",
                        cardHover: "#F7F8F9",
                    },
                    fontFamily: {
                        poppins: ["Poppins", "sans-serif"],
                        dm: ["DM Sans", "sans-serif"],
                    },
                },
            },
        };
    </script>
</head>

<body class="bg-white min-h-screen font-poppins">

    <!--
      กล่องใหญ่: 1420 x 736
      กล่องย่อย: 333 x 268
      mobile 375px = 1 คอลัมน์
      desktop = 4 คอลัมน์
    -->
    <div class="max-w-[1920px] mx-auto flex justify-center px-4 py-10 lg:py-16">

        <!-- กล่องใหญ่ -->
        <section class="w-full max-w-[1420px] lg:w-[1420px] lg:h-[736px] flex flex-col items-center lg:justify-between gap-8 lg:gap-0">

            <!-- หัวข้อ -->
            <h1 class="text-center text-darkBlue font-bold text-[28px] lg:text-[40px] leading-[125%]">
                Browse by
                <span class="relative inline-block z-10">
                    Job
                    <span class="absolute left-0 right-0 bottom-1 -z-10 h-3 bg-[#FFB088]"></span>
                </span>
                Categories
            </h1>

            <!-- กริดการ์ด -->
            <div class="w-full grid grid-cols-1 lg:grid-cols-4 gap-5 lg:gap-[30px] justify-items-center">

                <!-- 1. Digital Marketing -->
                <a href="#" class="group bg-white hover:bg-cardHover w-full max-w-[333px] lg:w-[333px] h-[268px] rounded-[8px] border border-cardBorder p-[30px] flex justify-between no-underline">
                    <div class="flex flex-col justify-between">
                        <div class="bg-softOrange group-hover:bg-orange group-hover:shadow-[0_12px_16px_rgba(0,0,0,0.08)] w-20 h-20 rounded-full flex items-center justify-center">
                            <img src="icons/speaker.svg" alt="" class="w-10 h-10 group-hover:hidden">
                            <img src="icons/whiteSpeaker.svg" alt="" class="w-10 h-10 hidden group-hover:block">
                        </div>
                        <div>
                            <h2 class="text-darkBlue font-semibold text-xl leading-8">Digital Marketing</h2>
                            <p class="text-greyText font-dm text-base mt-2">143 Jobs Opened</p>
                        </div>
                    </div>
                    <div class="flex items-end">
                        <img src="icons/arrow-right-btn.svg" alt="" class="w-[33px] h-[33px]">
                    </div>
                </a>

                <!-- 2. Art & Design -->
                <a href="#" class="group bg-white hover:bg-cardHover w-full max-w-[333px] lg:w-[333px] h-[268px] rounded-[8px] border border-cardBorder p-[30px] flex justify-between no-underline">
                    <div class="flex flex-col justify-between">
                        <div class="bg-softOrange group-hover:bg-orange group-hover:shadow-[0_12px_16px_rgba(0,0,0,0.08)] w-20 h-20 rounded-full flex items-center justify-center">
                            <img src="icons/pen.svg" alt="" class="w-10 h-10 group-hover:hidden">
                            <img src="icons/whitePen.svg" alt="" class="w-10 h-10 hidden group-hover:block">
                        </div>
                        <div>
                            <h2 class="text-darkBlue font-semibold text-xl leading-8">Art &amp; Design</h2>
                            <p class="text-greyText font-dm text-base mt-2">110 Jobs Opened</p>
                        </div>
                    </div>
                    <div class="flex items-end">
                        <img src="icons/arrow-right-btn.svg" alt="" class="w-[33px] h-[33px]">
                    </div>
                </a>

                <!-- 3. Accounting (active) -->
                <a href="#" class="group bg-cardHover w-full max-w-[333px] lg:w-[333px] h-[268px] rounded-[8px] border border-cardBorder p-[30px] flex justify-between no-underline">
                    <div class="flex flex-col justify-between">
                        <div class="bg-orange shadow-[0_12px_16px_rgba(0,0,0,0.08)] w-20 h-20 rounded-full flex items-center justify-center">
                            <img src="icons/whiteDollar-sign.svg" alt="" class="w-10 h-10">
                        </div>
                        <div>
                            <h2 class="text-darkBlue font-semibold text-xl leading-8">Accounting</h2>

                        <div class="bg-softOrange group-hover:bg-orange group-hover:shadow-[0_12px_16px_rgba(0,0,0,0.08)] w-20 h-20 rounded-full flex items-center justify-center">
                            <img src="icons/camera.svg" alt="" class="w-10 h-10 group-hover:hidden">
                            <img src="icons/whiteCamera.svg" alt="" class="w-10 h-10 hidden group-hover:block">
                        </div>
                        <div>
                            <h2 class="text-darkBlue font-semibold text-xl leading-8">Photography</h2>
                            <p class="text-greyText font-dm text-base mt-2">95 Jobs Opened</p>
                        </div>
                    </div>
                    <div class="flex items-end">
                        <img src="icons/arrow-right-btn.svg" alt="" class="w-[33px] h-[33px]">
                    </div>
                </a>

                <!-- 5. Copy Writing -->

                    <div class="flex flex-col justify-between">
                        <div class="bg-softOrange group-hover:bg-orange group-hover:shadow-[0_12px_16px_rgba(0,0,0,0.08)] w-20 h-20 rounded-full flex items-center justify-center">
                            <img src="icons/create.svg" alt="" class="w-10 h-10 group-hover:hidden">
                            <img src="icons/whiteCreate.svg" alt="" class="w-10 h-10 hidden group-hover:block">
                        </div>
                        <div>
                            <h2 class="text-darkBlue font-semibold text-xl leading-8">Copy Writing</h2>
                            <p class="text-greyText font-dm text-base mt-2">113 Jobs Opened</p>
                        </div>
                    </div>
                    <div class="flex items-end">
                        <img src="icons/arrow-right-btn.svg" alt="" class="w-[33px] h-[33px]">

                </a>

                    <div class="flex flex-col justify-between">
                        <div class="bg-softOrange group-hover:bg-orange group-hover:shadow-[0_12px_16px_rgba(0,0,0,0.08)] w-20 h-20 rounded-full flex items-center justify-center">
                            <img src="icons/headphone.svg" alt="" class="w-10 h-10 group-hover:hidden">
                            <img src="icons/whiteHeadphone.svg" alt="" class="w-10 h-10 hidden group-hover:block">

                        </div>
                    </div>
                    <div class="flex items-end">
                        <img src="icons/arrow-right-btn.svg" alt="" class="w-[33px] h-[33px]">

                </a>

                <!-- 7. Human Resources -->
                <a href="#" class="group bg-white hover:bg-cardHover w-full max-w-[333px] lg:w-[333px] h-[268px] rounded-[8px] border border-cardBorder p-[30px] flex justify-between no-underline">
                    <div class="flex flex-col justify-between">
                        <div class="bg-softOrange group-hover:bg-orange group-hover:shadow-[0_12px_16px_rgba(0,0,0,0.08)] w-20 h-20 rounded-full flex items-center justify-center">
                            <img src="icons/humans.svg" alt="" class="w-10 h-10 group-hover:hidden">
                            <img src="icons/whiteHumans.svg" alt="" class="w-10 h-10 hidden group-hover:block">
                        </div>
                        <div>
                            <h2 class="text-darkBlue font-semibold text-xl leading-8">Human Resources</h2>
                            <p class="text-greyText font-dm text-base mt-2">25 Jobs Opened</p>
                        </div>
                    </div>
                    <div class="flex items-end">
                        <img src="icons/arrow-right-btn.svg" alt="" class="w-[33px] h-[33px]">
                    </div>
                </a>

                <!-- 8. Explore -->
                <a href="#" class="relative bg-orange w-full max-w-[333px] lg:w-[333px] h-[268px] rounded-[8px] flex items-center justify-center overflow-hidden no-underline">
                    <img src="icons/twoWaves.svg" alt="" class="absolute inset-0 w-full h-full object-cover pointer-events-none">
                    <div class="relative z-10 flex items-end gap-2 text-white text-2xl font-medium leading-[34px]">
                        <span>Explore<br>30 More<br>Categories</span>
                        <img src="icons/arrow-right-white-btn.svg" alt="" class="w-[33px] h-[33px] mb-1">
                    </div>
                </a>

            </div>
        </section>
    </div>

</body>
</html>
